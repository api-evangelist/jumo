name: Jumo
description: >-
  JUMO is a Cape Town-based banking-as-a-service (BaaS) platform, founded in 2015,
  that uses artificial intelligence to power digital credit and savings products for
  banks, mobile network operators, and payments providers across emerging markets in
  Africa. Its infrastructure has two foundational capabilities: Core, an end-to-end
  next-generation banking platform that replaces legacy core banking with no build
  cost, and Unify, an AI processor that transforms alternative data (such as GSM
  records and mobile wallet transactions) to reduce the cost and risk of lending.
  JUMO delivers financial services through partners including Airtel, MTN Group,
  Orange Money Group, and Mukuru, and has disbursed over USD 8 billion to more than
  31 million people across Ghana, Kenya, Tanzania, Zambia, Uganda, Cote d'Ivoire,
  South Africa, Benin, and Cameroon. It is a certified B Corporation backed by
  investors including Anthemis, LeapFrog Investments, Fidelity Management, and Visa.
  JUMO's APIs and integrations are provided privately to regulated financial-institution
  partners rather than through a public developer portal.
